server:
  port: 8081

spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orders}
    username: ${DB_USER:orderflow}
    password: ${DB_PASSWORD:orderflow}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # The value serializer is chosen by type in KafkaConfig (JSON, text or bytes).
      acks: all
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: dev.viktorstrohush.orderflow.events.StockResultEvent
        spring.json.trusted.packages: dev.viktorstrohush.orderflow.events
        spring.json.use.type.headers: false

orderflow:
  inventory:
    base-url: ${INVENTORY_BASE_URL:http://localhost:8082}
    connect-timeout: 2s
    read-timeout: 3s
  outbox:
    poll-interval-ms: 500
  auth:
    # Secure by default: the demo login is off and there is no built-in secret.
    # The "dev" profile (application-dev.yml) enables both for development and for Docker Compose.
    demo-login-enabled: ${DEMO_LOGIN_ENABLED:false}
    jwt-secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
